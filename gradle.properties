# 增加 Gradle 可用内存；同时针对本机环境做适配
#
# preferIPv4Stack：避免 JVM 选中不通的 IPv6 路径导致「连接挂死」
# 超时参数：缩短单次失败等待，让重试循环转得更快
#
# --patch-module：修复本机 Files.isWritable() 恒为 false 的环境缺陷。
# 用 --patch-module 替换 sun.nio.fs.AbstractFileSystemProvider，比 Java agent 更干净：
# 不需要 agent、不需要 ASM，因此不会与 Fabric Loader 的 classpath 校验冲突。
#
# 内存特意压到 1280m：本机页面文件偏小，同时开测试服务端(2G) + Gradle 守护进程
# 会触发「页面文件太小」而无法创建 JVM。
org.gradle.jvmargs=-Xmx1280m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 --patch-module java.base=D:/HuaweiMoveData/Users/HUAWEI/Documents/deepseek-harness/default-workspace/containerbot/tools/patch-module/classes
org.gradle.parallel=true

# Gradle 的原生文件监视器在本机无法创建线程（Couldn't open current thread, error = 5）。
# 该报错无害，但会刷屏；一次性构建也不需要增量监视，直接关掉。
org.gradle.vfs.watch=false

systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.java.net.preferIPv4Stack=true

# ---- Fabric 属性（取自 FabricMC/fabric-example-mod 的 1.21.8 分支）----
minecraft_version=1.21.8
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# ---- 模组属性 ----
# 每次功能变化都提升此版本号；构建后 jar 会自动归档到 releases/
version=1.28.1
group=com.containerbot
archives_base_name=containerbot

# ---- 依赖 ----
# 刻意与玩家实例中已安装的 fabric-api 版本保持一致（0.131.0+1.21.8），
# 以确保编译期用到的 API 在运行期必然存在。
fabric_api_version=0.131.0+1.21.8

# ===========================================================================
# 关于本机环境缺陷（重要，勿删）
#
# 现象：Files.isWritable() 对任何路径都返回 false，而实际写入完全正常。
#
# 根因：JDK 在 Windows 上用 GetEffectiveRightsFromAcl 计算 ACL 有效权限，
# 而该 Win32 函数不识别「登录会话关联的组权限」（如 Authenticated Users）
# 与调用者特权，因而误判。JDK 又把异常吞掉了：
#
#   // sun.nio.fs.AbstractFileSystemProvider
#   public boolean isWritable(Path path) {
#       try { checkAccess(path, AccessMode.WRITE); }
#       catch (IOException e) { return false; }     // <- 异常被吞
#       return true;
#   }
#
# 受害组件（都栽在同一个 API 上）：
#   - jdk.nio.zipfs.ZipFileSystem：readOnly 被置真 -> 写 zip/jar 抛
#     ReadOnlyFileSystemException（Fabric Loom 写 mappings 崩在这）
#   - tinyremapper.OutputConsumerPath：「the jar file ... can't be written」
#     （Fabric Loader 首次启动重映射游戏 jar 崩在这）
#
# 修复：tools/patch-module/ 下是打过补丁的 AbstractFileSystemProvider，
# 把 isWritable 改为用 java.io.File.canWrite() 判断（只查 DOS 只读属性，本机准确）。
# 通过上面的 --patch-module 挂载。
#
# 已排除的非原因：沙盒、JDK 版本（21/25 一致）、完整性级别、文件 ACL、
# 路径位置、重解析点。
#
# 另注：Fabric Loader 会校验 classpath，一旦发现重复的 ASM 类就拒绝启动
# （IllegalStateException: duplicate ASM classes found on classpath），
# 所以修复方式不能是「往 classpath 里塞 agent jar」——--patch-module 不受此限。
#
# 警告：不要用 PowerShell 的 Get-Content/Set-Content 修改本文件！
# PS 5.1 会按 GBK 读 UTF-8 并写入 BOM，把中文注释变乱码、并合并换行。
# ===========================================================================
